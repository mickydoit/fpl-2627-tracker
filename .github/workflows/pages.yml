name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  # The refresh job commits with the default GITHUB_TOKEN, and GitHub
  # deliberately does not raise `push` events for those commits — it is how it
  # stops workflows triggering each other forever. The consequence here was
  # invisible and total: every data refresh committed fine, and NONE of them
  # ever deployed. The site only moved when a human pushed, which masked it
  # completely during a week of active development, and left the live data 10
  # hours stale the moment that stopped.
  #
  # workflow_run fires on the refresh job finishing, whatever token caused it.
  workflow_run:
    workflows: ['Refresh FPL data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A failed refresh has nothing new to publish.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # No build step — the site is plain HTML, CSS and ES modules, and the
      # data it reads is committed JSON in the same repo. But only what a
      # browser can ask for is published: the research warehouse (5.5MB, read by
      # nothing on the site), the scripts, the tests and the docs were all being
      # uploaded and deployed forty-eight times a day.
      - name: Assemble the site
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git*' --exclude '_site' --exclude 'node_modules' \
            --exclude 'data/warehouse' --exclude 'data/draft/raw' \
            --exclude 'scripts' --exclude 'docs' --exclude 'supabase' \
            --exclude '*.md' --exclude 'package*.json' --exclude '.mcp.json'
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      # Two failures in a month, neither ours: once deploy-pages listed the
      # artifact a fraction of a second after upload and found none, once the
      # deployment hung to its ten-minute timeout. Both cleared on the next
      # run. So: one attempt that may fail quietly, a pause, then one that
      # may not.
      - id: first
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 180000
      - if: steps.first.outcome == 'failure'
        run: sleep 20
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
