name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  # The refresh job commits with the default GITHUB_TOKEN, and GitHub
  # deliberately does not raise `push` events for those commits — it is how it
  # stops workflows triggering each other forever. The consequence here was
  # invisible and total: every data refresh committed fine, and NONE of them
  # ever deployed. The site only moved when a human pushed, which masked it
  # completely during a week of active development, and left the live data 10
  # hours stale the moment that stopped.
  #
  # workflow_run fires on the refresh job finishing, whatever token caused it.
  workflow_run:
    workflows: ['Refresh FPL data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A failed refresh has nothing new to publish.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # No build step — the site is plain HTML, CSS and ES modules, and the
          # data it reads is committed JSON in the same repo.
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
