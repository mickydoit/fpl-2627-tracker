name: Refresh FPL data

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort and can run late under
    # load, which is fine — the FPL API edge-caches for ~5 minutes anyway.
    - cron: '*/30 * * * *'
    # Once daily, 04:15 UTC, this same job runs with DEEP=1 and additionally
    # sweeps element-summary for every plausibly-owned player. That is ~300
    # requests and several minutes of runner time, which is why it is daily and
    # not half-hourly — but it is the only source of per-gameweek xG, xA,
    # defensive contribution, tackles and minutes, so it has to run somewhere.
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      deep:
        description: 'Also fetch per-player match logs (slower)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch FPL and ESPN data
        env:
          # Repository variable, not a secret — your entry id is public anyway.
          FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
          FPL_LEAGUE_IDS: ${{ vars.FPL_LEAGUE_IDS }}
          DEEP: ${{ (inputs.deep || github.event.schedule == '15 4 * * *') && '1' || '0' }}
        run: node scripts/fetch-all.mjs

      - name: Fetch Draft data
        env:
          # Optional. Set it and the board additionally mirrors your league's
          # managers and live ownership; leave it unset and everything still
          # works exactly as it did on draft night. A Draft league id is public
          # and identifies nobody, so it is a variable rather than a secret.
          FPL_DRAFT_LEAGUE_ID: ${{ vars.FPL_DRAFT_LEAGUE_ID }}
          # Which league entry is the owner's. Without it the mirror still
          # carries all six squads but cannot mark one of them "you", and the
          # Draft dashboard renders an empty shell.
          FPL_DRAFT_ENTRY_ID: ${{ vars.FPL_DRAFT_ENTRY_ID }}
        run: node scripts/fetch-draft.mjs
        continue-on-error: true

      # 21 ESPN calls, so it rides the daily deep slot rather than every
      # half hour. Rosters barely move day to day and the map is only useful
      # once per match anyway. continue-on-error because ESPN has no contract:
      # if it 403s, the previously committed map stays in place and every FPL
      # projection carries on untouched.
      # ESPN 2025/26 evidence for players the Premier League has never seen.
      # Rides the daily deep slot: the cache is permanent per player per season,
      # so this is a slowly-filling backlog rather than a per-refresh cost.
      # continue-on-error because ESPN has no contract — a failure leaves the
      # previous cache and every projection falls back to its own prior.
      - name: Fetch ESPN player history (2025/26 only)
        if: ${{ inputs.deep || github.event.schedule == '15 4 * * *' }}
        env:
          ESPN_HISTORY_MAX: '80'
        run: node scripts/fetch-espn-history.mjs
        continue-on-error: true

      - name: Rebuild player identity map
        if: ${{ inputs.deep || github.event.schedule == '15 4 * * *' }}
        run: node scripts/build-identity.mjs
        continue-on-error: true

      # Runs on every refresh, but the first call tells it whether anything
      # has finished since last time — so outside a matchday it costs one
      # request and exits. Capped per run so a backlog cannot eat the runner.
      # continue-on-error: ESPN has no contract, and a match missed now is
      # simply collected on the next run.
      - name: Collect finished matches (ESPN)
        env:
          ESPN_MAX_MATCHES: '12'
        run: node scripts/fetch-espn-matches.mjs
        continue-on-error: true

      # Must run BEFORE derive, and before the deadline it is capturing. The
      # projection for a gameweek is only a prediction until its deadline
      # passes; afterwards FPL wipes and refills the season totals, so anything
      # recomputed later is a different number wearing the same name.
      - name: Archive the gameweek
        run: node scripts/archive-gameweek.mjs
        continue-on-error: true

      - name: Rebuild projections
        run: node scripts/derive.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "fpl-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          # The scheduled job and a manual run can race; rebase rather than fail.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
